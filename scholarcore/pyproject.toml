[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarcore"
version = "0.1.0"
description = "A small, dependency-free shared vocabulary for academic data: Person, Paper, Award, Opportunity, Organization."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639. `license-files` cannot reach above the project root, so
# scholarcore/LICENSE is a byte-identical copy of the monorepo root
# LICENSE (which is canonical). Keep them identical.
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nathan Sheffield" },
]
keywords = ["academic", "research", "schema", "pydantic", "orcid", "grants"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = [
    "pytest",
    "jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scholarcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# There is no [tool.ruff] section here. This package lives in the
# researcher-profiles monorepo, whose root ruff.toml is the single lint config
# for the whole tree (`ruff check .` from the repo root, which is what CI runs).
# A [tool.ruff] table in this file would take precedence for every file under
# scholarcore/ and silently diverge from the rest of the repo.
